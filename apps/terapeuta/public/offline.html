<!doctype html>
<html lang="es-MX">

    <title>Sin conexión · NOEMA</title>
    <style>

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;

        justify-content: center;
        gap: 12px;
        background: #f1ece0;
        color: #2a3328;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;

        margin-top: 8px;
        border: 0;
        border-radius: 10px;

        font-size: 0.95rem;
        font-weight: 600;

      }

  <body>
    <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="NOEMA">
      <circle cx="48" cy="60" r="36" fill="none" stroke="#2e3b2e" stroke-width="4" />
      <circle cx="72" cy="60" r="36" fill="none" stroke="#2e3b2e" stroke-width="4" />
    </svg>
    <h1>Sin conexión</h1>
    <p>Necesitas internet para usar NOEMA. Revisa tu conexión y vuelve a intentar.</p>
